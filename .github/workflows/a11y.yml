name: CI — typage, lint, tests, build, a11y

on:
  push:
    branches: [main]
  pull_request:

# Annule les exécutions supplantées sur la même référence.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifications:
    name: Installation figée, typage, lint, Vitest, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4

      # Version de Bun figée (celle avec laquelle bun.lock a été vérifié) :
      # « latest » rendait l'installation non reproductible.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # Seul le magasin de Bun est mis en cache ; l'installation tourne
      # toujours, en mode figé, pour échouer si bun.lock est désynchronisé.
      - name: Cache du magasin Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Installation (lockfile figé)
        run: bun install --frozen-lockfile

      # Le tsconfig.json racine a « files: [] » : `tsc` seul ne vérifie rien.
      # Le script typecheck cible explicitement app, node et e2e.
      - name: Typage réel
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Vitest (suite complète, dont axe / contraste élevé / états d'auth)
        run: bunx vitest run

      # Build de production sans variables : doit réussir (page de
      # maintenance servie si le backend n'est pas configuré).
      - name: Build
        run: bun run build

  playwright:
    name: Playwright (Chromium) — axe réel, tabulation, contraste élevé, états d'auth
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Cache du magasin Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Installation (lockfile figé)
        run: bun install --frozen-lockfile

      # Seul Chromium est utilisé (les deux projets forcent browserName).
      - name: Chromium + dépendances système
        run: bunx playwright install --with-deps chromium

      # Les captures pixel (@visual) sont exclues ici : aucune référence n'a
      # jamais été générée sur ubuntu-latest. Elles tournent et se
      # (re)génèrent via le workflow manuel « visual.yml ».
      # Le build lancé par webServer utilise une config Supabase factice et
      # hermétique (voir playwright.config.ts) : aucun secret requis.
      - name: Playwright (hors captures pixel)
        run: bunx playwright test --grep-invert @visual
        env:
          CI: '1'

      - name: Rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
